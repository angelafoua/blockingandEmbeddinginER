# Recursive LSH Default Configuration

# Word Signature Generation
signature:
  # Method: 'fuzzy' (automatic), 'phonetic' (names), 'manual' (explicit)
  method: 'fuzzy'

  # Similarity threshold for fuzzy matching (0-100)
  # Higher = stricter (only very similar words grouped)
  # Lower = looser (many variations grouped)
  # Recommended: 75-95
  similarity_threshold: 85

# LSH Bucketing Parameters
lsh:
  # MinHash number of permutations (hash functions)
  # Higher = more accurate but slower
  # Typical values: 64, 128, 256, 512
  num_perm: 128

  # Jaccard similarity threshold for bucketing (0.0-1.0)
  # Lower threshold = more candidates (higher recall, slower)
  # Higher threshold = fewer candidates (lower recall, faster)
  # Recommended: 0.3-0.9
  threshold: 0.5

  # Maximum recursion depth for refinement
  # Higher = more refined buckets (smaller, more specific)
  # Too high = over-partition (false negatives)
  # Recommended: 2-5
  max_depth: 3

  # Minimum records per bucket before stopping refinement
  # Higher = stop refining earlier (fewer, larger buckets)
  # Lower = refine more (many, smaller buckets)
  # Recommended: 1-10
  min_bucket_size: 2

# Record Matching Parameters
matching:
  # Similarity threshold for matching records (0.0-1.0)
  # Lower = more lenient (more matches, higher recall)
  # Higher = more strict (fewer matches, higher precision)
  # Recommended: 0.7-0.95
  threshold: 0.8

  # Similarity metric
  # 'jaccard': Token overlap (default)
  # 'cosine': For vector-based data
  method: 'jaccard'

# Record Merging Parameters
merging:
  # Strategy for merging duplicate records
  # 'union': Combine all tokens from all records (default)
  # 'first': Keep first record's tokens
  # 'vote': Keep tokens that appear in majority of records
  strategy: 'union'

# Logging and Output
logging:
  # Enable verbose logging
  verbose: false

  # Log level: 'DEBUG', 'INFO', 'WARNING', 'ERROR'
  level: 'INFO'

  # Save logs to file
  save_logs: true
  log_file: 'recursive_lsh.log'

# Performance Parameters
performance:
  # Number of processes for parallel execution
  # 0 = single-threaded, -1 = all available CPUs
  num_workers: 1

  # Batch size for processing large datasets
  batch_size: 1000

# Evaluation Parameters (for testing)
evaluation:
  # Save results to file
  save_results: true

  # Results output directory
  output_dir: 'results/'

  # Generate detailed report
  generate_report: true

  # Save confusion matrix
  save_confusion_matrix: true
